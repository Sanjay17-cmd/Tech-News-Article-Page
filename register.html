<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Tech News</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <nav>
      <a href="home.html">Home</a>
      <a href="about.html">About</a>
      <a href="register.html">Register</a>
      <a href="contact.html">Contact</a>
    </nav>

    <header>
      <h1>Register Visitor</h1>
      <p>Store your info locally in browser cookies without a database.</p>
    </header>

    <section class="section-card">
      <form id="registerForm">
        <label for="regName">Name</label>
        <input type="text" id="regName" name="regName" placeholder="Your name" required />

        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" name="regEmail" placeholder="you@example.com" required />

        <label for="favoriteTopic">Favorite topic</label>
        <input type="text" id="favoriteTopic" name="favoriteTopic" placeholder="Tech topic you like" required />

        <label class="check">
          <input type="checkbox" id="terms" name="terms" />
          I agree to store my info in cookies.
        </label>

        <button type="submit" class="submit-button">Save Info</button>
      </form>

      <button id="showCookiesBtn" class="small-button">Show Cookies</button>
      <button id="clearCookiesBtn" class="small-button">Clear Cookies</button>
      <p id="cookieDisplay" class="small-text">Your data will appear here!</p>
      <div id="registerResult" class="article-details"></div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
